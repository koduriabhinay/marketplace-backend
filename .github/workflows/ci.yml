name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://marketplace:marketplace@localhost:5432/marketplace_test
      # In CI the Redis and RabbitMQ suites always run against the real services.
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  # The website: lint, typecheck, component tests (Vitest + Testing Library), production build.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  # Boots the whole production-like stack (Nginx, 3 API replicas, 2 workers, Postgres
  # primary + replica, Redis, RabbitMQ, Prometheus, Grafana) and tests it end to end over
  # HTTPS, the way a client on the internet would use it.
  e2e:
    runs-on: ubuntu-latest
    needs: [check, web]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create throwaway secrets and a TLS certificate
        run: |
          mkdir -p secrets
          openssl rand -hex 32 > secrets/jwt_secret
          openssl rand -hex 32 > secrets/encryption_key
          ./scripts/dev-cert.sh
      - name: Start the stack
        run: docker compose up -d --build
      - name: Smoke test through Nginx
        run: node scripts/smoke.mjs
        env:
          NODE_EXTRA_CA_CERTS: deploy/nginx/certs/tls.crt
      # A real browser clicks through the website served by Nginx: a seller lists a
      # product with a photo, a customer buys it, reloads (session cookie), and cancels.
      - name: Install Playwright's Chromium
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Browser end-to-end test
        working-directory: web
        run: npx playwright test
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
      - name: Show logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --tail=100
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # Continuous delivery: every merge to main publishes a versioned image to GitHub's
  # container registry. The deploy job below then just pulls that tag; nothing is built on servers.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [check, web, e2e]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      # The website image: Nginx with the built React site inside.
      - id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # Continuous deployment (Phase 7): after the images are published, the server pulls and
  # runs exactly this commit. Skipped until the DEPLOY_HOST repository variable exists, so
  # forks and fresh clones stay green. Setup: docs/PHASE-7.md.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    needs: [publish]
    timeout-minutes: 15
    # One deploy at a time; a newer one waits instead of cancelling a half-finished one.
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://${{ vars.DEPLOY_DOMAIN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # The server's identity is pinned: we never "trust on first use" from CI.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy this commit
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/deploy-remote.sh "deploy@$DEPLOY_HOST" "sha-${{ github.sha }}"
