# Prometheus pulls ("scrapes") /metrics from every API and worker container.
# Docker DNS returns one address per replica, so scaled-up containers are found
# automatically (in Kubernetes you'd use kubernetes_sd_configs instead).
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 3000
        refresh_interval: 10s

  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 3001
        refresh_interval: 10s

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
