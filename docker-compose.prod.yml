# Production overrides (Phase 7). Used together with the base file on the server:
#
#   docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# scripts/deploy.sh runs that for you. What changes compared to your laptop:
#   - images are pulled from the registry (built once by CI), never built on the server;
#   - only Nginx is reachable from the internet (ports 80 and 443, set in .env.prod);
#   - databases, queue and dashboards publish no ports, or only on 127.0.0.1;
#   - every long-running container restarts by itself after a crash or a reboot;
#   - certbot gets and renews a real certificate from Let's Encrypt.
#
# `!reset` and `!override` replace a list from the base file instead of adding to it
# (Docker Compose 2.24+).
services:
  postgres:
    restart: unless-stopped
    ports: !reset []
    volumes: !override
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/10-replication.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro

  postgres-replica:
    restart: unless-stopped

  redis:
    restart: unless-stopped
    ports: !reset []

  rabbitmq:
    restart: unless-stopped
    ports: !reset []

  migrate:
    build: !reset null

  api:
    build: !reset null
    restart: unless-stopped

  worker:
    build: !reset null

  nginx:
    build: !reset null

  # Dashboards are for you, not the internet: reach them through an SSH tunnel, e.g.
  #   ssh -L 3030:127.0.0.1:3030 deploy@your-server   then open http://localhost:3030
  prometheus:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:9090:9090"

  grafana:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:3030:3000"

  # Not a running service: scripts/prod-cert.sh starts it for a few seconds to get or
  # renew the certificate. The "tools" profile keeps it out of `docker compose up`.
  certbot:
    image: certbot/certbot:v3.0.1
    profiles: [tools]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      - ./deploy/nginx/certs:/out

volumes:
  letsencrypt:
